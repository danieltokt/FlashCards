{% extends 'base.html' %}
{% block title %}Сброс пароля{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">🔑 Забыли пароль?</h1>
        <p style="color:#64748b;margin-bottom:1.5rem;text-align:center">
            Введи свой email и мы отправим ссылку для сброса пароля
        </p>
        <form method="post">
            {% csrf_token %}
            <input type="email" name="email" class="form-input" placeholder="Email" required
                   style="margin-bottom:1rem;width:100%">
            <button type="submit" class="btn-primary" style="width:100%">
                Отправить ссылку
            </button>
        </form>
        <div style="text-align:center;margin-top:1rem">
            <a href="{% url 'login' %}" style="color:#2563eb">← Назад к входу</a>
        </div>
    </div>
</div>
{% endblock %}
