{% extends 'base.html' %}
{% block title %}Письмо отправлено{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card" style="text-align:center">
        <div style="font-size:3rem;margin-bottom:1rem">📧</div>
        <h1 class="auth-title">Проверь почту</h1>
        <p style="color:#64748b;margin-bottom:1.5rem">
            Если этот email зарегистрирован, мы отправили ссылку для сброса пароля.
            Проверь папку "Спам" если письмо не пришло.
        </p>
        <a href="{% url 'login' %}" class="btn-primary" style="display:inline-block">
            Вернуться к входу
        </a>
    </div>
</div>
{% endblock %}
